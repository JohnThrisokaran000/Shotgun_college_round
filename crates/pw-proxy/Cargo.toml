[package]
name = "pw-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
brotli = "9.0.0"
bytes = "1.12.1"
flate2 = "1.1.10"
hex = "0.4.3"
pw-core = { version = "0.1.0", path = "../pw-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
