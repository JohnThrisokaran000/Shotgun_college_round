[package]
name = "pw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
playwright-rs = "0.19.0"
pw-core = { version = "0.1.0", path = "../pw-core" }
pw-model = { version = "0.1.0", path = "../pw-model" }
pw-proxy = { version = "0.1.0", path = "../pw-proxy" }
pw-train = { version = "0.1.0", path = "../pw-train" }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"

[[bin]]
name = "pw"
path = "src/main.rs"
