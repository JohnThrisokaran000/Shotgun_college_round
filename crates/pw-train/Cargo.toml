[package]
name = "pw-train"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
half = "2.7.1"
hex = "0.4.3"
pw-core = { version = "0.1.0", path = "../pw-core" }
pw-model = { version = "0.1.0", path = "../pw-model" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
